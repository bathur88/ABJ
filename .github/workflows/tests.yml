name: Tests

on:
  push:
    branches: [master, main, 'claude/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1-5' # weekday morning regression run

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright UI + API + Pact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
      XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
      XRAY_PROJECT_KEY: ${{ vars.XRAY_PROJECT_KEY }}
      XRAY_TEST_PLAN_KEY: ${{ vars.XRAY_TEST_PLAN_KEY }}
      XRAY_BASE_URL: ${{ vars.XRAY_BASE_URL }}
      XRAY_TEST_ENVIRONMENT: chromium
      XRAY_REVISION: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        id: tests
        continue-on-error: true
        run: npx playwright test

      - name: Upload HTML report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            reports/
            test-results/
          retention-days: 14

      - name: Upload Pact contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: pacts/
          if-no-files-found: warn

      - name: Push results to Xray
        if: always() && env.XRAY_CLIENT_ID != '' && env.XRAY_PROJECT_KEY != ''
        run: bash scripts/xray-import.sh reports/junit.xml

      - name: Note when Xray is not configured
        if: always() && (env.XRAY_CLIENT_ID == '' || env.XRAY_PROJECT_KEY == '')
        run: |
          echo "::notice::Xray upload skipped. Add XRAY_CLIENT_ID / XRAY_CLIENT_SECRET secrets and XRAY_PROJECT_KEY variable to enable it."

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
